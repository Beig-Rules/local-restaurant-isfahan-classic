<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رستوران کلاسیک اصفهان</title>
  <style>
    body { font-family: Vazirmatn, sans-serif; background:#111; color:#eee; margin:0; }
    .hero { background:#000; padding:5rem 1rem; text-align:center; }
    h1 { font-size:2.8rem; }
    .menu { max-width:700px; margin:2rem auto; padding:0 1rem; }
    .item { display:flex; justify-content:space-between; padding:0.8rem 0; border-bottom:1px solid #333; }
    .cta { text-align:center; margin:2rem; }
    a.btn { background:#fff; color:#000; padding:0.8rem 2rem; text-decoration:none; font-weight:600; }
  </style>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
  <div class="hero">
    <h1>کلاسیک اصفهان</h1>
    <p>غذای سنتی اصیل — از سال 1360</p>
  </div>
  <div class="menu">
    <div class="item"><span>قرمه سبزی اصفهانی</span><span>185,000</span></div>
    <div class="item"><span>کباب برگ</span><span>320,000</span></div>
    <div class="item"><span>میرزا قاسمی</span><span>95,000</span></div>
  </div>
  <div class="cta"><a href="#" class="btn">رزرو میز</a></div>
</body>
</html>
